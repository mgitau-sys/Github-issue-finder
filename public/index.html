<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Good First Issue Finder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="wrap">
    <h1>Good First <span>Issue</span></h1>
    <p>Find beginner-friendly open-source issues to start contributing to.</p>
  </header>

  <form id="searchForm" class="wrap search-form">
    <select id="language" name="language">
      <option value="">Any language</option>
      <option value="JavaScript">JavaScript</option>
      <option value="TypeScript">TypeScript</option>
      <option value="Python">Python</option>
      <option value="Java">Java</option>
      <option value="Go">Go</option>
      <option value="Rust">Rust</option>
      <option value="C%2B%2B">C++</option>
      <option value="Ruby">Ruby</option>
      <option value="HTML">HTML</option>
      <option value="CSS">CSS</option>
    </select>

    <input type="text" id="topic" name="topic" placeholder="Keyword, e.g. web, cli" autocomplete="off" />

    <select id="minStars" name="minStars">
      <option value="">Any stars</option>
      <option value="10">10+ stars</option>
      <option value="100">100+ stars</option>
      <option value="1000">1,000+ stars</option>
      <option value="10000">10,000+ stars</option>
    </select>

    <select id="sort" name="sort">
      <option value="">Best match</option>
      <option value="updated">Recently updated</option>
      <option value="created">Newest</option>
      <option value="comments">Most discussed</option>
    </select>

    <button type="submit">Search</button>
  </form>

  <main class="wrap">
    <p id="statusBar" role="status" aria-live="polite"></p>
    <div id="resultsGrid" class="results-grid"></div>
  </main>

  <footer class="wrap">
    <p>Powered by the <a href="https://docs.github.com/en/rest/search" target="_blank" rel="noopener">GitHub Search API</a>.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
